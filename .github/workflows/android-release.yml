name: Android signed release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/smartclip-release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VITE_SMARTCLIP_BACKEND_URL: ${{ secrets.SMARTCLIP_BACKEND_URL }}
      VITE_SMARTCLIP_API_TOKEN: ${{ secrets.SMARTCLIP_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Decode temporary release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo '::error::Decoded keystore is empty'; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Generate Android project
        run: rm -rf android && npx cap add android
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed release APK
        run: gradle --init-script ../scripts/android-release.init.gradle assembleRelease
        working-directory: frontend/android

      - name: Verify APK signature and prepare predictable filename
        run: |
          version_name="$(sed -n 's/^VERSION_NAME=//p' android-version.properties)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match configured version v$version_name"
            exit 1
          fi
          apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "SmartClip-v${version_name}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartClip-signed-apk
          path: frontend/SmartClip-v*.apk
          if-no-files-found: error

      - name: Delete temporary keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"
