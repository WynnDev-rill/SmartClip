[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartclip-api"
version = "0.1.0"
description = "SmartClip HTTP API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0,<1", "uvicorn[standard]>=0.34.0,<1", "pydantic-settings>=2.7.0,<3", "yt-dlp[default]==2026.7.15"]

[project.optional-dependencies]
dev = ["httpx>=0.28.0,<1", "pytest>=8.3.0,<9", "ruff>=0.9.0,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
